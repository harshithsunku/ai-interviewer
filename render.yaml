services:
  - type: web
    name: ai-interviewer
    runtime: node
    plan: free
    buildCommand: export NODE_ENV=development && npm install && cd server && npm install && cd ../client && npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://ai-interviewer-yzg5.onrender.com
      - key: DATABASE_URL # Supabase Session pooler URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: groq
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID # read by the client build; same value as GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
    healthCheckPath: /api/health
    autoDeploy: true
