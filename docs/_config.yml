title: AI Interviewer
description: Voice-based mock technical interviews, powered by Groq (LLM, Whisper, Orpheus) and Postgres.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

color_scheme: dark
search_enabled: true
heading_anchors: true
enable_copy_code_button: true

mermaid:
  version: "11.4.1"

aux_links:
  "View on GitHub":
    - "https://github.com/harshithsunku/ai-interviewer"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/harshithsunku/ai-interviewer"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: "AI Interviewer — documentation lives in <code>docs/</code> and is updated with every change."

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
